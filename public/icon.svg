<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <rect width="100" height="100" rx="20" fill="#0F172A"/>
  <!-- Open Book Base -->
  <path d="M22 30 C 35 26, 45 28, 50 34 C 55 28, 65 26, 78 30 L 78 72 C 65 68, 55 70, 50 75 C 45 70, 35 68, 22 72 Z" fill="#1E293B" stroke="#6366F1" stroke-width="3" stroke-linejoin="round"/>
  <!-- Center spine divider -->
  <line x1="50" y1="34" x2="50" y2="75" stroke="#6366F1" stroke-width="2.5"/>
  <!-- Text lines with yellow highlight -->
  <line x1="28" y1="42" x2="44" y2="42" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Amber highlight on left page -->
  <rect x="27" y="47" width="17" height="6" rx="2" fill="#F59E0B" fill-opacity="0.8"/>
  <line x1="28" y1="50" x2="42" y2="50" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="58" x2="40" y2="58" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right page with confusion red asterisk -->
  <line x1="56" y1="42" x2="72" y2="42" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="50" x2="68" y2="50" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Red confusion asterisk pin -->
  <circle cx="71" cy="55" r="7" fill="#EF4444" />
  <text x="71" y="59" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" fill="#FFFFFF">*</text>
  <line x1="56" y1="62" x2="66" y2="62" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
